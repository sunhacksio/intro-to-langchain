[project]
name = "intro-to-langchain"
version = "0.1.0"
description = "Intro to LangChain and Agents Workshop at sunhacks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama ; sys_platform == 'win32'",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langgraph-cli[inmem]",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pyrefly",
    "ruff",
]
